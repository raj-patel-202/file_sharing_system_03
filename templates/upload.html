{% extends "layout.html" %}
{% block title %}SYS.SHARE // Upload File{% endblock %}
{% block content %}
<div class="form-container" style="max-width: 560px; margin-top: 12px;">
    <form id="upload-form" aria-label="File upload form">
        <div class="form-group">
            <label for="file-input">SELECT FILE:</label>
            <input type="file" id="file-input" name="file" required style="display: none;">
            <div class="file-drop-zone" id="file-drop-zone" role="button" tabindex="0" aria-label="Click or drop file here to select a file for upload">
                <span id="file-drop-text">[ CLICK OR DROP FILE HERE ]</span>
            </div>
        </div>
        <div class="form-group">
            <label for="filename-input">CUSTOM FILE NAME:</label>
            <input type="text" id="filename-input" name="filename" placeholder="(Optional) Leave empty for original name">
        </div>
        <div class="form-group">
            <label for="visibility-input">VISIBILITY:</label>
            <select id="visibility-input" name="visibility">
                <option value="private">Private</option>
                <option value="public">Public</option>
            </select>
        </div>
        <div id="upload-controls">
            <button type="submit" id="start-btn" class="btn-submit">[START UPLOAD]</button>
            <button type="button" id="resume-btn" style="display: none;">[RESUME]</button>
            <button type="button" id="pause-btn" style="display: none;">[PAUSE]</button>
        </div>
    </form>
    <div id="upload-status" aria-live="polite" role="status"></div>
    <div id="upload-speed" aria-live="polite"></div>
    <div id="progress-bar-container" style="display: none;" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Upload progress">
        <div id="progress-bar"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/upload.js" defer></script>
{% endblock %}
