{% extends "layout.html" %}
{% block title %}SYS.SHARE // Login{% endblock %}

{% block layout %}
<div class="auth-page">
    <button id="theme-toggle" style="position: absolute; top: 20px; right: 20px;">[DARK]</button>
    <div class="auth-logo">
        <div class="logo-text logo-large">SYS<span class="logo-dot">.</span>SHARE</div>
        <div class="logo-subtitle">SECURE FILE TRANSFER TERMINAL</div>
    </div>
    <div class="form-container">
        <h2>LOGIN</h2>
        <form id="login-form">
            <div class="form-group">
                <label>USERNAME:</label>
                <input type="text" id="username" required autocomplete="off" autofocus placeholder="Enter username...">
            </div>
            <div class="form-group">
                <label>PASSWORD:</label>
                <input type="password" id="password" required placeholder="Enter password...">
            </div>
            <button type="submit" class="btn-submit">[AUTHENTICATE]</button>
        </form>
        <div class="auth-footer">
            No account? <a href="/register" class="auth-link">[CREATE ACCOUNT]</a>
        </div>
        <div id="error-msg" class="error" style="display: none;"></div>
    </div>
</div>
{% endblock %}
