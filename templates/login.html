{% extends "layout.html" %}
{% block title %}SYS.SHARE // Login{% endblock %}

{% block layout %}
<a href="#main-content" class="skip-link">Skip to main content</a>
<div class="scanlines" aria-hidden="true"></div>
<div class="auth-page">
    <button id="theme-toggle" style="position: absolute; top: 20px; right: 20px;" aria-label="Toggle to dark theme">[DARK]</button>
    <div class="auth-logo">
        <div class="logo-text logo-large" aria-label="SYS.SHARE">SYS<span class="logo-dot" aria-hidden="true">.</span>SHARE</div>
        <div class="logo-subtitle">SECURE FILE TRANSFER TERMINAL</div>
    </div>
    <div class="form-container" id="main-content" role="main">
        <h2>LOGIN</h2>
        <form id="login-form" aria-label="Login form">
            <div class="form-group">
                <label for="username">USERNAME:</label>
                <input type="text" id="username" name="username" required autocomplete="username" autofocus placeholder="Enter username...">
            </div>
            <div class="form-group">
                <label for="password">PASSWORD:</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter password...">
            </div>
            <button type="submit" class="btn-submit">[AUTHENTICATE]</button>
        </form>
        <div class="auth-footer">
            No account? <a href="/register" class="auth-link">[CREATE ACCOUNT]</a>
        </div>
        <div id="error-msg" class="error" style="display: none;" role="alert" aria-live="assertive"></div>
    </div>
</div>
{% endblock %}
