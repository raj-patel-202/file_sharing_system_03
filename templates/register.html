{% extends "layout.html" %}
{% block title %}SYS.SHARE // Register{% endblock %}

{% block layout %}
<div class="auth-page">
    <div class="auth-logo">
        <div class="logo-text logo-large">SYS<span class="logo-dot">.</span>SHARE</div>
        <div class="logo-subtitle">SECURE FILE TRANSFER TERMINAL</div>
    </div>
    <div class="form-container">
        <h2>REGISTER</h2>
        <form id="register-form">
            <div class="form-group">
                <label>USERNAME:</label>
                <input type="text" id="username" required autocomplete="off" autofocus placeholder="Choose username...">
            </div>
            <div class="form-group">
                <label>PASSWORD:</label>
                <input type="password" id="password" required placeholder="Choose password...">
            </div>
            <button type="submit" class="btn-submit">[CREATE ACCOUNT]</button>
        </form>
        <div class="auth-footer">
            Already registered? <a href="/login" class="auth-link">[LOGIN]</a>
        </div>
        <div id="error-msg" class="error" style="display: none;"></div>
    </div>
    <div class="auth-version">v2.0</div>
</div>
{% endblock %}
